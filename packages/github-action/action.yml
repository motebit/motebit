name: "Verify motebit.md"
description: "Verify the Ed25519 signature of a motebit.md agent identity file"
author: "Motebit"

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to the motebit.md file"
    required: false
    default: "motebit.md"
  fail-on-missing:
    description: "Fail the action if the identity file is not found"
    required: false
    default: "true"
  node-version:
    description: "Node.js version to use"
    required: false
    default: "20"

outputs:
  valid:
    description: "Whether the signature is valid (true/false)"
    value: ${{ steps.verify.outputs.valid }}
  motebit-id:
    description: "The motebit_id from the identity file"
    value: ${{ steps.verify.outputs.motebit_id }}
  public-key:
    description: "The public key fingerprint (first 16 hex chars)"
    value: ${{ steps.verify.outputs.public_key }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Verify motebit.md
      id: verify
      shell: bash
      # Inputs reach the script through env vars, never as `${{ }}` inside the
      # script body — an expression there is spliced into the shell source
      # before bash parses it (a path containing `"; curl … #` would run).
      env:
        MOTEBIT_FILE: ${{ inputs.path }}
        MOTEBIT_FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        # The canonical motebit-verify CLI, pinned to the version on npm for
        # CI reproducibility. Bump deliberately; the CI smoke job
        # (`github-action-smoke` in .github/workflows/ci.yml) runs this exact
        # Action against an identity file freshly generated by the repo's own
        # generator, so a pin that stops accepting current files goes red.
        MOTEBIT_VERIFY_VERSION: "1.8.15"
      run: |
        FILE="$MOTEBIT_FILE"

        if [ ! -f "$FILE" ]; then
          echo "::warning::motebit.md not found at $FILE"
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "motebit_id=" >> "$GITHUB_OUTPUT"
          echo "public_key=" >> "$GITHUB_OUTPUT"

          if [ "$MOTEBIT_FAIL_ON_MISSING" = "true" ]; then
            echo "::error::motebit.md not found at $FILE"
            exit 1
          fi
          exit 0
        fi

        # A path starting with "-" would be read as a flag by the CLI.
        case "$FILE" in -*) FILE="./$FILE" ;; esac

        # Exit codes (motebit-verify): 0 verified, 1 detected but invalid,
        # 2 usage / I/O error / not an identity file. `--expect identity`
        # makes any other signed artifact type a failure, not a pass.
        set +e
        JSON=$(npx --yes "@motebit/verify@${MOTEBIT_VERIFY_VERSION}" "$FILE" --expect identity --json)
        EXIT_CODE=$?
        set -e

        echo "$JSON"

        if [ $EXIT_CODE -eq 0 ]; then
          # Fields from the structured result: identity.motebit_id and the
          # first 16 hex chars of identity.identity.public_key.
          FIELDS=$(printf '%s' "$JSON" | node -e '
            let s = "";
            process.stdin.on("data", (c) => (s += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(s);
              const id = r.identity ?? {};
              const pk = (id.identity && id.identity.public_key) || "";
              const ok = r.valid === true && r.type === "identity";
              process.stdout.write(`${ok}\n${id.motebit_id ?? ""}\n${pk.slice(0, 16)}\n`);
            });
          ')
          VALID=$(echo "$FIELDS" | sed -n 1p)
          MOTEBIT_ID=$(echo "$FIELDS" | sed -n 2p)
          PUBLIC_KEY=$(echo "$FIELDS" | sed -n 3p)
        else
          VALID=false
        fi

        if [ "$VALID" = "true" ]; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "motebit_id=$MOTEBIT_ID" >> "$GITHUB_OUTPUT"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          echo "::notice::motebit.md signature verified successfully"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "motebit_id=" >> "$GITHUB_OUTPUT"
          echo "public_key=" >> "$GITHUB_OUTPUT"
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::motebit.md could not be verified (not a readable motebit identity file)"
          else
            echo "::error::motebit.md signature verification failed"
          fi
          exit 1
        fi
