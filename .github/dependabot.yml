version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Maturity gate (cooldown): don't open a PR until a release has been out long
    # enough to shake out .0 bugs and yanks; majors wait longest. The "let it
    # mature" behavior — does NOT delay security advisories, which still fire
    # immediately. Added after the long-tail major pileup (≈15 open PRs, mostly
    # bleeding-edge majors branched off stale main).
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-major-days: 21
    # Majors we have already decided against — each ignore names its release
    # condition; none is "never". Without these, dependabot re-opens the same
    # rejected PR every weekly run. Full rationale lives in the closing
    # comments of #234 / #235 / #238 / #239 / #240.
    ignore:
      # docs/doctrine/foundational-tool-adoption.md: TypeScript pinned ^5.9 —
      # TS 6.0 was adopted and reverted (upstream @typescript-eslint/TS-6 bug
      # broke typed-linting in ~19 packages). Remove on the doctrine's named
      # re-evaluation trigger.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node majors track the Node runtime actually in use (22 today).
      # Bump the types major together with the runtime major, deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint 9+ forces the flat-config migration — a foundational-tool
      # adoption arc (same doctrine as TypeScript). eslint 8 is EOL, so this
      # arc should be scheduled deliberately; remove the ignore when it is.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # pnpm.overrides caps @hono/node-server at <2.0.0. A manifest-only major
      # bump would claim 2.x while 1.x actually installs (manifest-vs-installed
      # drift, see #240). Remove together with the override.
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]
      # jsdom 29 requires undici 7; pnpm.overrides caps undici at <7.0.0
      # (see #239). Remove together with the undici override bump.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # @peculiar/x509 v2 drops bundled reflect-metadata and forces a global
      # polyfill + tsyringe DI onto the 4 attestation verifiers; no advisory
      # against v1. Deferred 2026-07-24 (#397 pass). Remove when a CVE lands
      # against v1 or a v2-only feature is needed.
      - dependency-name: "@peculiar/x509"
        update-types: ["version-update:semver-major"]
      # Babel's rule: runtime major must match the transform major. The mobile
      # toolchain (babel-preset-expo) transforms with babel 7 — SDK 57 still
      # peers on runtime ^7.20.0 (verified 2026-07-26). Remove when
      # babel-preset-expo peers on @babel/runtime ^8, and bump in the SAME
      # change as that Expo move.
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # Expo SDK majors are a migration arc (expo install --fix, config +
      # native-module review, real metro bundle, app boot on the consent-root
      # surface), never a lockfile merge. Remove when the SDK-57 arc is
      # scheduled; the RN companions below ride the same arc.
      #
      # expo and its modules version as <SDK>.<minor>.<patch>, so a minor is
      # off the SDK line too (#844, below); patches flow inside the SDK's ~
      # ranges.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      # The Expo SDK line (#844). An Expo SDK pins ONE React Native line and the
      # Metro/Hermes that can parse it, and names exact or ~ versions for its
      # native modules (apps/mobile/node_modules/expo/bundledNativeModules.json).
      # A bump off that line is not a smaller SDK upgrade — it is an app that
      # cannot be bundled: dependabot moved react-native 0.83.10 -> 0.87.0
      # under SDK 55 and no iOS/Android build could be produced (Metro's
      # hermes-parser cannot read RN 0.87's Flow). These versions move only
      # through `CI=1 npx expo install --fix` in apps/mobile, inside the SDK
      # arc (#416). `pnpm check-mobile-expo-alignment` (invariant #164) holds
      # the lockfile to the SDK table, so anything these rules miss goes red
      # in CI. Remove/re-scope each rule when the SDK-57 arc lands, against
      # that SDK's table.
      #
      # react-native: only apps/mobile uses it, and the SDK names it exactly,
      # so every bump leaves the line.
      - dependency-name: "react-native"
      # SDK-pinned exactly (or to one patch) — every bump leaves the line.
      # react-native-webview was also held for an upstream type regression:
      # 13.16.2 changed the default type parameter from `WebView<P = {}>` to
      # `WebView<P = undefined>`, which reduces `WebViewProps & undefined` to
      # `never` so every prop on a plain `<WebView …/>` fails to typecheck;
      # 13.17.0 still carries it. SDK 55 pins 13.16.0, before the regression.
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-webview"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "react-native-get-random-values"
        update-types: ["version-update:semver-minor"]
      # react is shared with web / docs / operator / inspector / proxy, so
      # patches keep flowing for them; a minor or major leaves SDK 55's
      # `react 19.2.0`. apps/mobile pins react exactly: a react patch PR that
      # also rewrites mobile's pin goes red on check-mobile-expo-alignment —
      # keep mobile's pin at the SDK's version in that PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Grouping strategy: isolate blast radius.
    #
    # Crypto deps are security-critical — any compromise undermines the thesis,
    # so they land as their own PR that a human reviews with the noble/scure
    # release notes in hand.
    #
    # High-blast-radius ecosystem deps (TypeScript, @types/node, Vite, vitest
    # family, ESLint, jsdom) each get their own isolated group. A major bump
    # of any one of these typically requires tsconfig edits, type-cast
    # fallout, or config migration — bundling them turns a reviewable PR into
    # an unmergeable one. See PR #41 (9 simultaneous majors → CI wedge).
    #
    # The residual dev-major / production-major groups catch the long tail of
    # low-blast-radius majors (test helpers, a11y utilities, lint plugins) —
    # these may still be bundled since their combined risk is bounded.
    groups:
      # Security-critical crypto — never bundled
      crypto:
        patterns:
          - "@noble/*"
          - "@scure/*"

      # === High-blast-radius majors: each in their own group ===

      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"

      types-node:
        patterns:
          - "@types/node"

      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"

      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

      eslint:
        patterns:
          - "eslint"

      jsdom:
        patterns:
          - "jsdom"

      hono:
        patterns:
          - "hono"
          - "@hono/*"

      # SDKs / 0.x libraries that ship breaking changes inside minor/patch
      # bumps — isolated so a large jump never wedges the routine batch. Two
      # offenders proven (2026-06-06): @anthropic-ai/sdk 0.52→0.101 rode the
      # production-minor-patch group straight onto the proxy/ai-core caching
      # path, and @ricky0123/vad-web dropped RealTimeVADOptions.stream in a
      # 0.0.x bump and red-wedged the whole group via apps/spatial's build.
      # Each now lands as its own reviewable PR.
      anthropic-sdk:
        patterns:
          - "@anthropic-ai/*"

      vad:
        patterns:
          - "@ricky0123/vad-web"

      # === Residual groups (long tail) ===

      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@noble/*"
          - "@scure/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/node"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "jsdom"
          - "hono"
          - "@hono/*"
          - "@anthropic-ai/*"
          - "@ricky0123/vad-web"

      dev-major:
        dependency-type: "development"
        update-types:
          - "major"
        exclude-patterns:
          - "@noble/*"
          - "@scure/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/node"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "jsdom"
          - "hono"
          - "@hono/*"
          - "@anthropic-ai/*"
          - "@ricky0123/vad-web"

      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@noble/*"
          - "@scure/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/node"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "jsdom"
          - "hono"
          - "@hono/*"
          - "@anthropic-ai/*"
          - "@ricky0123/vad-web"

      production-major:
        dependency-type: "production"
        update-types:
          - "major"
        exclude-patterns:
          - "@noble/*"
          - "@scure/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "@types/node"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "jsdom"
          - "hono"
          - "@hono/*"
          - "@anthropic-ai/*"
          - "@ricky0123/vad-web"

    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # cooldown for github-actions supports only default-days — the semver-*
    # keys are invalid here and an invalid config stops Dependabot processing
    # (caught by the dependabot-api validation check on PR #291).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
