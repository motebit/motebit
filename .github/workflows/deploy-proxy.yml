name: Deploy CORS Proxy

on:
  push:
    branches: [main]
    paths:
      - "services/proxy/**"
      # A lockfile or root-manifest change (dependency security fixes,
      # pnpm.overrides) changes the built image without touching this
      # service's own files — it must redeploy too. Witnessed 2026-09-13:
      # the advisory triage merge redeployed only the relay.
      - "pnpm-lock.yaml"
      - "package.json"
      # Root build config the build reads: the workspace list, the task
      # graph and the tsconfig every workspace package extends. Held by
      # scripts/check-vercel-ignore-build.ts (paths ⊇ the project's build
      # inputs).
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      # proxy depends on workspace packages (@motebit/crypto, policy,
      # protocol, sdk and their closure), so package changes redeploy it.
      - "packages/**"
  workflow_dispatch:

concurrency:
  group: deploy-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch can run on any ref; only main deploys production.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
