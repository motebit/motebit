name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  # `cla` is a required check, so it must report on the merge queue's commit
  # or every entry stalls (.github/required-checks.json; docs/ops/RUNBOOK.md §16).
  merge_group:
    types: [checks_requested]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'merge_group' ||
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
       github.event_name == 'pull_request_target')
    steps:
      # The CLA verdict is a property of the PR's commit authors against
      # signatures/cla.json, and the queue only admits a PR whose `cla` check
      # already passed on its head. Merging cannot change that verdict: the
      # queue commit adds no authored commits of its own, a new push to the PR
      # removes it from the queue (and re-runs this job on `synchronize`), and
      # the signatures file is append-only. The CLA action itself cannot run
      # here — it reads a pull request the merge_group payload does not carry —
      # so the queue run reports the carried-over verdict explicitly instead of
      # being skipped (a skipped required check reports success silently).
      - name: Merge queue — CLA verdict carries over from the PR
        if: github.event_name == 'merge_group'
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          echo "cla: ${HEAD_REF} — the queued PR's required cla check passed on its head before it could enter the queue; merging cannot change the verdict."

      - name: CLA Assistant
        if: github.event_name != 'merge_group'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/motebit/motebit/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],renovate[bot],github-actions[bot],hakimlabs
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this, you need to sign our [Contributor License Agreement](https://github.com/motebit/motebit/blob/main/CLA.md).

            To sign, please comment on this PR with:

            > I have read the CLA Document and I hereby sign the CLA

            This is a one-time process. Once signed, all future contributions are covered.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
