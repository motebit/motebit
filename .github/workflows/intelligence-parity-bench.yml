# Intelligence-parity bench: does routing a turn through motebit make the SAME
# model slower or worse than calling the provider API directly?
#
# Route A runs the real runtime turn path (system-prompt assembly, context
# trimming, memory pipeline, AnthropicProvider). Route B calls the API directly
# with the parameters A actually sent (copied off the wire), a neutral system
# prompt and the full untrimmed conversation. B′ (routes=A,B,Bp) replays A's
# exact request directly, which isolates pipeline time from prompt effect. A blind judge
# (a different model) scores the answers. See scripts/bench/intelligence-parity/.
#
# A MEASUREMENT: it changes no prompt, context policy, routing or model default.
#
# Secrets (repository level): ANTHROPIC_API_KEY. A missing key fails the run;
# it never degrades to a silent no-op.
#
# HARD SPEND GUARD: the run refuses to start when its estimate (tokens ×
# published price, scripts/bench/intelligence-parity/spend.ts) exceeds
# `max_usd`, and a live meter stops it before the next call once actual spend
# reaches `max_usd`. An unpriced model is refused, never priced at zero.
#
# MANUAL DISPATCH ONLY, and that is why this file has no `if: failure()` alert:
# a human triggered the run and is reading the artifact. If you add a
# `schedule:` trigger, add the failure-alert step from model-catalog-drift.yml
# in the same commit. Costs real tokens; deliberately not in `pnpm check`.

name: Intelligence-parity bench

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model under test (blank = the resolver's Anthropic default)"
        required: false
        type: string
        default: ""
      subset:
        description: "Comma list of prompt ids and/or categories (blank = all 25)"
        required: false
        type: string
        default: ""
      judge_model:
        description: "Judge model (must differ from the model under test)"
        required: false
        type: string
        default: "claude-opus-5-5"
      repetitions:
        description: "Repetitions per prompt"
        required: false
        type: string
        default: "1"
      routes:
        description: "Live routes: A,B (default) or A,B,Bp to also isolate pipeline time (~+50% spend)"
        required: false
        type: string
        default: "A,B"
      max_usd:
        description: "Hard spend ceiling for the whole run, USD"
        required: false
        type: string
        default: "5"

concurrency:
  group: intelligence-parity-bench
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the imported packages
        run: pnpm --filter @motebit/runtime... --filter @motebit/tools... --filter @motebit/ai-core... build
      - name: Spend guard (pre-flight estimate)
        env:
          MODEL: ${{ inputs.model }}
          SUBSET: ${{ inputs.subset }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          REPETITIONS: ${{ inputs.repetitions }}
          ROUTES: ${{ inputs.routes }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          npx tsx scripts/bench/intelligence-parity/run.ts estimate \
            --model="$MODEL" --subset="$SUBSET" --judge-model="$JUDGE_MODEL" \
            --repetitions="$REPETITIONS" --routes="$ROUTES" --max-usd="$MAX_USD"
      - name: Run routes, judge, report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          SUBSET: ${{ inputs.subset }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          REPETITIONS: ${{ inputs.repetitions }}
          ROUTES: ${{ inputs.routes }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          npx tsx scripts/bench/intelligence-parity/run.ts all \
            --model="$MODEL" --subset="$SUBSET" --judge-model="$JUDGE_MODEL" \
            --repetitions="$REPETITIONS" --routes="$ROUTES" --max-usd="$MAX_USD" \
            --out=bench-out/intelligence-parity
      - name: Publish report to the job summary
        if: always()
        run: |
          if [ -f bench-out/intelligence-parity/report.md ]; then
            cat bench-out/intelligence-parity/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intelligence-parity-${{ github.run_id }}
          path: bench-out/intelligence-parity/
          if-no-files-found: warn
