name: Deploy Research Service

on:
  push:
    branches: [main]
    paths:
      - "services/research/**"
      - "packages/**"
      # A lockfile or root-manifest change (dependency security fixes,
      # pnpm.overrides) changes the built image without touching this
      # service's own files — it must redeploy too. Witnessed 2026-09-13:
      # the advisory triage merge redeployed only the relay.
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # The service self-bootstraps its identity from the persistent /data
      # volume on first boot — no out-of-band ceremony. Required one-time
      # setup before the first deploy:
      #   fly apps create motebit-research
      #   fly volumes create research_data --size 1 --region sjc
      #   fly secrets set MOTEBIT_SYNC_URL=... MOTEBIT_API_TOKEN=... \
      #                   ANTHROPIC_API_KEY=... \
      #                   MOTEBIT_WEB_SEARCH_URL=... MOTEBIT_READ_URL_URL=...
      - name: Deploy to Fly.io
        # A HANG must fail, not vanish: a job killed by the ceiling
        # reports as `cancelled`, which no `if: failure()` alert
        # matches. See deploy-sync.yml for the incident that showed it.
        timeout-minutes: 15
        run: |
          set -o pipefail
          flyctl deploy --config services/research/fly.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
