name: Deploy Sync Relay

on:
  push:
    branches: [main]
    paths:
      - "services/relay/**"
      - "packages/**"
      # A lockfile or root-manifest change (dependency security fixes,
      # pnpm.overrides) changes the built image without touching this
      # service's own files — it must redeploy too. Witnessed 2026-09-13:
      # the advisory triage merge redeployed only the relay.
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-relay-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # read the CI run status for the gate below

# The gate WAITS; the deploy WORKS. They are separate jobs because they were
# not, and the waiting ate the working.
#
# As one 30-minute job, the gate's wait came out of the deploy's budget: CI took
# 11 minutes to conclude, the Fly build then ran 19 and was killed at the job
# timeout. GitHub reports a timed-out job as "cancelled", which reads like
# somebody stopped it rather than like a deploy that never landed — so two
# consecutive merges (the durable-execution and halt arcs) sat on main, CI-green
# and believed shipped, while production kept serving the release from the day
# before. A remote halt cannot reach a relay that never received the route.
#
# Split, each job gets its own clock: the gate may wait out a slow CI without
# spending a minute the build needs.
jobs:
  gate:
    runs-on: ubuntu-latest
    # 20 min for CI + 12 min for the staging relay deploy + slack.
    timeout-minutes: 40

    steps:
      # The relay is the durability-sensitive trust root; never deploy a commit
      # whose CI is failing. This workflow and CI both fire on the same push, so
      # we wait for the CI run on THIS sha to conclude and refuse to deploy unless
      # it is green. Manual `workflow_dispatch` bypasses the gate (an operator
      # deploying by hand has already decided). Drift-defense: the prod deploy was
      # previously ungated — a red CI did not block it.
      - name: Gate on CI success
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha='${{ github.sha }}'
          echo "Waiting for CI to conclude on ${sha} before deploying prod…"
          for i in $(seq 1 80); do
            run=$(gh run list --repo '${{ github.repository }}' --workflow ci.yml \
              --branch main --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha==\"${sha}\")][0]")
            status=$(echo "${run}" | jq -r '.status // "pending"')
            conclusion=$(echo "${run}" | jq -r '.conclusion // ""')
            echo "  attempt ${i}: CI status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "CI is green — proceeding to deploy."
                exit 0
              fi
              echo "::error::CI concluded '${conclusion}' for ${sha} — refusing to deploy prod relay."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for CI to conclude on ${sha}."
          exit 1

      # Prod builds AFTER staging, never beside it (#978).
      #
      # Both relay workflows fire on the same push, pass their CI gates in the
      # same second, and build a byte-identical image (same manifest digest)
      # on the same Depot builder. Three first attempts in a row (runs
      # 36503795166 attempt 2, 36536672742, 36549886284) pushed the same layer
      # to registry.fly.io within 100 ms of staging's push of it: staging's
      # finished in under a second, prod's never finished, and flyctl sat
      # silent until the step deadline. Every rerun, with nothing beside it,
      # landed in under three minutes. So prod waits for this sha's staging
      # run to conclude — whatever its conclusion; this is ordering, not a
      # promotion gate — and then pushes into a registry that already holds
      # the layers. Cross-workflow `needs:` does not exist and a shared
      # concurrency group would let one app's pending deploy cancel the
      # other's, so the gate polls, as it already does for CI. The wait is
      # bounded: past it prod proceeds with a warning and the deploy's own
      # stall-retry below is the second line.
      - name: Wait for the staging relay deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha='${{ github.sha }}'
          for i in $(seq 1 48); do
            run=$(gh run list --repo '${{ github.repository }}' --workflow deploy-sync-staging.yml \
              --branch main --json headSha,status,conclusion \
              --jq "[.[] | select(.headSha==\"${sha}\")][0]" || true)
            status=$(echo "${run:-null}" | jq -r '.status // "absent"')
            conclusion=$(echo "${run:-null}" | jq -r '.conclusion // ""')
            echo "  attempt ${i}: staging relay deploy status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              echo "Staging relay deploy concluded (${conclusion}) — prod may build now."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::The staging relay deploy of ${sha} did not conclude within 12 minutes — deploying prod anyway; the deploy's stall-retry covers a collision."

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    # The Fly remote build gets the whole budget, not what the gate left over.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # A HANG must fail, not vanish.
      #
      # A successful deploy of this app takes under three minutes. On
      # 2026-09-17 one ran for thirty and was killed by the job ceiling,
      # which GitHub reports as `cancelled` — a conclusion that reads
      # like an operator stopped it, that no `if: failure()` alert
      # matches, and that left production two increments behind with a
      # green-looking pipeline above it. Raising the ceiling would only
      # have bought a longer silence, so the deploy carries its own
      # deadline and exits non-zero when it passes one.
      #
      # The stall #978 hit sits in the image PUSH, before any machine is
      # touched, so `--wait-timeout` (which bounds the machine rollout) never
      # fires; `timeout` bounds the whole command and exits 124 on a stall.
      # A stall gets exactly one retry (the step below); any other failure
      # does not. `LOG_LEVEL=debug` so the next stall shows where it stops.
      - name: Deploy to Fly.io
        id: deploy
        # The retry step below owns the job's verdict for this step.
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          rc=0
          timeout --kill-after=30s 11m \
            flyctl deploy --config services/relay/fly.toml --remote-only \
              --wait-timeout 10m || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LOG_LEVEL: debug

      # Exactly one retry, and only of a stall: `timeout` exit 124 (or 137 if
      # the kill was needed), or no recorded code at all (the step deadline
      # fired first). A non-stall failure is re-raised here unretried, so the
      # job still fails and the backstop below still says so.
      - name: Retry the deploy once after a stall
        if: steps.deploy.outcome == 'failure'
        timeout-minutes: 12
        run: |
          set -o pipefail
          rc='${{ steps.deploy.outputs.rc }}'
          case "${rc}" in
            124|137|"") ;;
            *)
              echo "::error::The relay deploy failed with exit ${rc} — not a stall, not retried."
              exit "${rc}"
              ;;
          esac
          echo "::warning title=Relay deploy stalled::The first deploy attempt stalled (exit '${rc:-step deadline}'); retrying once (#978)."
          timeout --kill-after=30s 11m \
            flyctl deploy --config services/relay/fly.toml --remote-only \
              --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LOG_LEVEL: debug

      # `cancelled` is not `failure`, so an alert keyed on failure alone
      # is silent on exactly the outcome that hid this one.
      - name: Say so when the deploy did not land
        if: cancelled() || failure()
        run: |
          echo "::error title=Relay deploy did not land::The relay deploy ended as ${{ job.status }} (after one retry if the first attempt stalled) — production is still on its previous release. A deploy of this app normally takes under three minutes, so this is a hang, not slowness. Check the fleet with \`flyctl releases -a motebit-sync\`, never the workflow colour."
          exit 1

      # A deploy that did not land must not read as one that did. The job
      # summary is where an operator looks first, so it carries the release
      # this run actually put into production.
      - name: Record the deployed release
        if: always()
        run: |
          echo "### Relay deploy — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          flyctl releases --app motebit-sync 2>&1 | head -3 >> "$GITHUB_STEP_SUMMARY" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
