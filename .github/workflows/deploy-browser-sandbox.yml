name: Deploy Browser Sandbox

on:
  push:
    branches: [main]
    paths:
      - "services/browser-sandbox/**"
      - "packages/protocol/**"
      # A lockfile or root-manifest change (dependency security fixes,
      # pnpm.overrides) changes the built image without touching this
      # service's own files — it must redeploy too. Witnessed 2026-09-13:
      # the advisory triage merge redeployed only the relay.
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-browser-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # Required one-time setup before the first deploy:
      #   fly apps create motebit-browser-sandbox
      #   fly secrets --app motebit-browser-sandbox set \
      #     MOTEBIT_API_TOKEN=...
      #
      # No persistent volume — the service is stateless re: the motebit
      # graph (every Chromium context is per-session, torn down on
      # dispose / idle). Audit + receipts live upstream in the runtime.
      - name: Deploy to Fly.io
        # A HANG must fail, not vanish: a job killed by the ceiling
        # reports as `cancelled`, which no `if: failure()` alert
        # matches. See deploy-sync.yml for the incident that showed it.
        timeout-minutes: 15
        run: |
          set -o pipefail
          flyctl deploy --config services/browser-sandbox/fly.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
