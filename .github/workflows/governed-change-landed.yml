name: Governed change landed

# The offline half of acceptance test B1 (docs/proposals/governed-repo-change-v1.md
# § "Acceptance tests"): after a governed change lands, "offline PASS on a
# fresh clone against a trusted tip, in a recorded workflow job with no network
# after the clone". It runs the offline landed mode of the verifier
# (spec/repo-change-v1.md §9, §9.1):
#
#   motebit-verify repo-change --landed <squash commit> --trusted-tip <commit>
#     --repository motebit/motebit --github-keys <file> --repo <clone> --json
#
# through scripts/governed-change-report.ts (its `landed` mode), which writes
# the inputs and every verdict axis to the job summary.
#
# ## Why workflow_dispatch only
#
# The run is a recorded witness someone asks for, after the landing, about one
# named squash commit (the `landed_commit` input). No push, pull request or
# merge-group event names that commit, and none should: on those events the
# workflow file or the tip can come from a change still in flight. A dispatch
# off main fails closed: the first step refuses it, the checkout ref resolves
# to no revision, and the report script's self-check refuses it again.
#
# ## Trust assumptions
#
#  - The trusted tip is `github.sha`, main's tip at dispatch. It is the
#    independent witness §9 asks for: the squash commit must be on its
#    first-parent chain. The verifier, its build, the report script and the
#    pinned keys (.motebit/operator-keys/github.json) all come from that tip.
#  - The landing time is GitHub's: the squash commit's committer time, accepted
#    only when GitHub signed it under a pinned key, inside that key's window
#    (§9.1, `temporalBasis: operator_recorded`). It is the operator's word,
#    weighed as such.
#  - "Fresh clone": the checkout below, full history (fetch-depth 0), into an
#    empty runner. Installing and building the verifier use the network; the
#    judgment does not.
#
# ## No network for the judgment
#
# What the judge step sets up, and nothing more is claimed:
#
#  - a new network namespace (`unshare --net`) with loopback only, and a new
#    mount namespace (`--mount --propagation private`, so no mount leaks to
#    the host) in which, as root, a fresh tmpfs is mounted over /run (and
#    over /var/run when it is not a symlink to /run): the path sockets that
#    live there (systemd-resolved's varlink socket, the D-Bus system bus,
#    docker.sock) do not exist in the judge's view;
#  - then the runner user, with supplementary groups CLEARED (so no `docker`
#    group) and no_new_privs (so no sudo back to root), and a clean env.
#
# Inside, BEFORE the verifier runs, the step fails unless every probe holds:
# `curl https://github.com` fails with exit 6 exactly (the name did not
# resolve; 7 would mean it did), `curl https://1.1.1.1` fails with 6 or 7,
# `getent hosts github.com` reports not found (exit 2), and none of
# /run/systemd/resolve/io.systemd.Resolve, /run/dbus/system_bus_socket and
# /var/run/docker.sock exists. The step before is the control: both curl
# requests succeed from the runner, so the failures inside are the
# namespace's, not an outage. The probes are what is proven; other
# filesystem-reachable channels (an abstract socket is per network
# namespace; a path socket outside /run is not probed) are not claimed.
#
# A namespace, not a host firewall (iptables -P OUTPUT DROP): the runner agent
# itself talks to GitHub over HTTPS for logs, status and job completion, and
# cutting the host's network would cut it too. The setup has never run on a
# live runner before its first dispatch, which is the real check; a setup
# failure (no unshare, no setpriv, a mount refused) fails the step closed,
# never reports VERIFIED.
#
# ## It judges, never writes
#
# Read-only token (contents: read), no secrets, no token passed to any step,
# persist-credentials: false, no dependency cache, no expression interpolated
# into a `run:` script (inputs reach scripts through step env only; the
# landed commit is checked to be exactly 40 lowercase hex digits before use).
# Nothing is pushed, commented or labelled. It is not a required check.
#
# scripts/__tests__/governed-change-landed-workflow.test.ts pins this file's
# exact shape; scripts/__tests__/governed-change-landed.tampers.mjs proves the
# pins bite.
on:
  workflow_dispatch:
    inputs:
      landed_commit:
        description: "The squash commit that landed the governed change (40 lowercase hex digits)"
        required: true
        type: string

# Least privilege: read the repository; nothing else.
permissions:
  contents: read

jobs:
  governed-change-landed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse a dispatch off main or a landed commit that is not a full commit id
        env:
          LANDED_COMMIT: ${{ inputs.landed_commit }}
        # Never echo either value: a line starting with :: is a workflow command.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "governed-change-landed runs only from refs/heads/main" >&2
            exit 1
          fi
          case "$LANDED_COMMIT" in
            *[!0-9a-f]*) echo "landed_commit must be 40 lowercase hex digits" >&2; exit 1 ;;
          esac
          if [ "${#LANDED_COMMIT}" -ne 40 ]; then
            echo "landed_commit must be 40 lowercase hex digits" >&2
            exit 1
          fi

      - name: Check out main's tip, full history (the fresh clone and the trusted tip)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's tip at dispatch; any other ref resolves to no revision.
          ref: ${{ github.ref == 'refs/heads/main' && github.sha || 'no-trusted-tip-off-main' }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          package_json_file: trusted/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          # NO dependency cache: the judgment runs only what this tip installs.
          package-manager-cache: false

      - name: Install the trusted tip's dependencies (uncached)
        working-directory: trusted
        run: pnpm install --frozen-lockfile

      - name: Build motebit-verify from the trusted tip
        working-directory: trusted
        run: pnpm --filter "@motebit/verify..." run build

      - name: "Control: the runner reaches the network (so the failures below are the namespace's)"
        working-directory: trusted
        run: |
          curl -sS --max-time 10 -o /dev/null https://github.com
          curl -sS --max-time 10 -o /dev/null https://1.1.1.1

      - name: Judge the landed change with no network (motebit-verify repo-change --landed)
        working-directory: trusted
        env:
          LANDED_COMMIT: ${{ inputs.landed_commit }}
          # main's tip at dispatch (the checkout's expression).
          TRUSTED_TIP: ${{ github.ref == 'refs/heads/main' && github.sha || 'no-trusted-tip-off-main' }}
        # New network and mount namespaces; as root, loopback up and /run
        # masked; then the runner user, groups cleared, no_new_privs, a
        # clean environment. Inside: every probe (header), then judge. The
        # verifier's exit decides the step.
        run: |
          sudo -- unshare --net --mount --propagation private -- sh -c '
            set -e
            ip link set lo up
            mount -t tmpfs -o nosuid,nodev,noexec,mode=0755 tmpfs /run
            if [ ! -L /var/run ]; then mount -t tmpfs -o nosuid,nodev,noexec,mode=0755 tmpfs /var/run; fi
            exec "$@"
          ' offline \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs -- \
            env -i PATH="$PATH" HOME="$HOME" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
              GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
              LANDED_COMMIT="$LANDED_COMMIT" TRUSTED_TIP="$TRUSTED_TIP" \
            sh -c '
              rc=0
              curl -sS --max-time 10 -o /dev/null https://github.com || rc=$?
              if [ "$rc" -ne 6 ]; then
                echo "github.com: curl exit $rc inside the namespace (only 6, could not resolve, is no network)" >&2
                exit 1
              fi
              rc=0
              curl -sS --max-time 10 -o /dev/null https://1.1.1.1 || rc=$?
              case "$rc" in
                6|7) ;;
                *) echo "1.1.1.1: curl exit $rc inside the namespace (only 6 or 7 is no network)" >&2; exit 1 ;;
              esac
              rc=0
              getent hosts github.com >/dev/null 2>&1 || rc=$?
              if [ "$rc" -ne 2 ]; then
                echo "getent hosts github.com: exit $rc inside the namespace (only 2, not found, is no resolver)" >&2
                exit 1
              fi
              for sock in /run/systemd/resolve/io.systemd.Resolve /run/dbus/system_bus_socket /var/run/docker.sock; do
                if [ -e "$sock" ] || [ -L "$sock" ]; then
                  echo "$sock exists inside the namespace" >&2
                  exit 1
                fi
              done
              echo "no network: github.com unresolved, 1.1.1.1 unreachable, getent not found, no resolver, bus or docker socket"
              exec ./node_modules/.bin/tsx scripts/governed-change-report.ts landed \
                --repository motebit/motebit --repo "$PWD" \
                --github-keys .motebit/operator-keys/github.json
            '
