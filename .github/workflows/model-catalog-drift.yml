# The first EXTERNAL drift gate (#475, inventory row #150): the model
# catalog's canonical truth lives OUTSIDE the repo (the provider's live
# models endpoint), so this defense cannot run in `pnpm check` — it runs on
# a schedule, the sibling of archetype-conformance. Red means the committed
# snapshot (ANTHROPIC_MODELS) or the request-shape families drifted from
# what the provider actually serves: hours-behind instead of months-behind,
# a red check instead of a user-facing 404.
#
# Secrets (repository level):
#   ANTHROPIC_API_KEY   read-only catalog access (GET /v1/models only)
#   OPENAI_API_KEY      restricted key — List models (read) + chat completions
#                       (request). #518: openai is the compat SHAPE that
#                       google/groq/deepseek all inherit, so its ids drifting
#                       is the widest single failure in the matrix.
#
# The gate runs with --require-key: a missing secret is RED, never a silent
# skip — a dormant external gate is the composition-preserves-enforcement
# flaw class in miniature.

name: Model catalog drift

on:
  schedule:
    - cron: "23 9 * * 1" # weekly, Monday
  workflow_dispatch:

concurrency:
  group: model-catalog-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the imported packages
        run: pnpm --filter @motebit/sdk... --filter @motebit/ai-core... build
      - name: Diff snapshot + shaping families against the live catalog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/check-model-catalog-drift.ts --require-key
      # A scheduled gate with no alert is a gate nobody reads. This one went RED
      # every week from 2026-08-10 to 09-07 — five consecutive runs carrying a
      # real finding (a shipped model id the provider had stopped serving) — and
      # nothing surfaced it, because the only signal was a red square on a page
      # no one opens. Same failure the archetype-conformance thread already
      # solved; this is that step, mirrored.
      - name: Alert on failure (pinned issue thread)
        if: failure()
        run: |
          gh issue list --label model-catalog-drift --state open --json number --jq '.[0].number' > /tmp/issue || true
          N=$(cat /tmp/issue)
          BODY="Scheduled model-catalog drift FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "Model catalog drift failing" --label model-catalog-drift --body "$BODY"; fi
        env:
          GH_TOKEN: ${{ github.token }}
