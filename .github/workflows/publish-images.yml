name: Publish Container Images

# Why this exists:
#
# Motebit's endgame is "operators run the relay, take the 5% fees" — third-party
# operators self-hosting the relay are the federation-unblock work. npm packages
# (the SDK, protocol, crypto verifiers) are not enough; the relay itself ships as
# a container so an operator can `docker pull ghcr.io/motebit/relay:X.Y.Z` and run.
#
# Every motebit-shipped image is:
#  - multi-arch (amd64 + arm64) via docker buildx — Apple Silicon dev,
#    Graviton/ARM cloud, single-arch is amateur in 2026.
#  - signed via cosign keyless OIDC + Sigstore — motebit's whole thesis is
#    verifiability (`docs/doctrine/self-attesting-system.md`); shipping unsigned
#    containers from a project whose value prop is "verify everything" is
#    incoherent.
#  - SBOM-attached (SPDX) — supply-chain audit surface.
#  - build-provenance attested (SLSA) via actions/attest-build-provenance —
#    binds the image to this exact workflow run + commit, verifiable by any
#    operator before pulling.
#  - tagged by SHA + branch/tag — never `:latest` (drift). Operators pin to
#    a version they verified.
#  - base-image pinned by SHA256 digest in the Dockerfile — same supply-chain
#    discipline motebit applies to FIDO/Apple/TPM trust roots in
#    `crypto-webauthn` / `crypto-appattest` / `crypto-tpm`.

on:
  push:
    branches: [main]
    tags:
      - "relay-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  relay:
    name: ghcr.io/motebit/relay
    runs-on: ubuntu-latest
    # The arm64 half builds under QEMU emulation and the cache export is
    # mode=max, so a normal run is 18-24 minutes. At 30 the margin was one bad
    # run wide, and on 2026-09-21 a run took 30.3 and was killed — reported as
    # `cancelled`, which reads like someone pressed a button rather than a
    # failure. 60 is headroom, not a target; if a run approaches it the build
    # has a problem worth looking at rather than a ceiling worth raising.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tag values
        id: tags
        run: |
          set -eu
          short_sha="${GITHUB_SHA:0:7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          # Two lists, deliberately. `sha_tag` is the immutable one this build
          # pushes; `alias_tags` are the names an operator is actually told to
          # pull, and they are applied only AFTER the image is signed and
          # attested. A job that dies in between therefore leaves a
          # digest-pinned tag nobody is pointed at, never a `:main` that
          # carries none of the guarantees this workflow's header promises.
          sha_tag="ghcr.io/motebit/relay:sha-${short_sha}"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          aliases=""
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            aliases="ghcr.io/motebit/relay:main"
          fi
          case "${GITHUB_REF}" in
            refs/tags/relay-v*)
              version="${GITHUB_REF#refs/tags/relay-v}"
              aliases="${aliases}${aliases:+ }ghcr.io/motebit/relay:${version}"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=0.0.0+sha.${short_sha}" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "alias_tags=${aliases}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (cross-arch emulation for arm64 builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Activation gate: probe the built image BEFORE anything is pushed ──
      #
      # The container-image rung of the booted-artifact tier
      # (docs/doctrine/composition-preserves-enforcement.md): the rungs below
      # it prove the source entry and the compiled dist enforce the security
      # boundaries; this step proves the SHIPPED artifact does — the
      # `pnpm deploy`-flattened filesystem, the pinned base image, `run.sh`
      # itself, booted exactly as an operator boots it, probed from outside
      # over real HTTP. A lost boundary here blocks the push: a bad image is
      # never published. amd64-only (the runner's native arch); the multi-arch
      # push below rebuilds from the shared buildx cache, so the probed layers
      # and the published amd64 layers are the same.
      - name: Build probe candidate (amd64, local load)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: motebit-relay-probe:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and probe deployed-behavior security boundaries
        run: |
          set -eu
          # Production-shaped strict env: the image's own defaults
          # (NODE_ENV=production, PORT=3000, MOTEBIT_DB_PATH=/data/motebit.db)
          # with NO security-boundary overrides — docker env is explicit, so
          # nothing ambient can leak in. Federation enabled so the #359
          # cross-org boundary is reachable.
          docker run -d --name relay-under-probe \
            -e X402_PAY_TO_ADDRESS=0x0000000000000000000000000000000000000000 \
            -e MOTEBIT_FEDERATION_ENDPOINT_URL=https://relay-under-probe.example/federation \
            motebit-relay-probe:candidate
          # The probe runs INSIDE the same image (sibling container sharing
          # the relay's network namespace) and imports the image's OWN
          # compiled probeSecurityBoundaries — the probe bytes are the
          # artifact's bytes.
          if ! docker run --rm \
            --network container:relay-under-probe \
            -v "$PWD/services/relay/scripts/probe-image.mjs:/probe.mjs:ro" \
            --entrypoint node \
            motebit-relay-probe:candidate /probe.mjs http://127.0.0.1:3000; then
            echo "── relay-under-probe logs ──"
            docker logs relay-under-probe || true
            exit 1
          fi
          docker rm -f relay-under-probe

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.sha_tag }}
          # Dynamic labels — Dockerfile carries static metadata; per-build
          # provenance fields go here so they reflect this exact run.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
          # Provenance + SBOM at build time. buildx writes both as image
          # attestations attached to the manifest list.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless via Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          # One signature, against the digest. Cosign stores a signature under
          # the DIGEST, so the previous loop over every tag wrote the same
          # signature repeatedly — and it could not have covered the alias
          # tags anyway, because they no longer exist at this point.
          cosign sign --yes "${{ steps.tags.outputs.sha_tag }}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/motebit/relay
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # LAST, and only on success. `:main` and `:X.Y.Z` are the names an
      # operator pulls, so they are applied to an image that is already signed
      # and attested — never alongside one that might not get there. This adds
      # a tag to the existing manifest list server-side; nothing is rebuilt or
      # re-uploaded, so the digest an operator verifies is the digest that was
      # signed.
      #
      # Why this shape: on 2026-09-21 the job timed out after the push and
      # before signing, and `:main` spent the next hours pointing at an
      # unsigned, unattested image — indistinguishable from a real release,
      # which is the failing-open direction. The workflow's own header promises
      # every shipped image is signed and provenance-attested; this is what
      # makes the promise structural rather than sequential.
      - name: Apply release tags to the signed image
        if: steps.tags.outputs.alias_tags != ''
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha_tag }}
          ALIASES: ${{ steps.tags.outputs.alias_tags }}
        run: |
          set -eu
          for alias in ${ALIASES}; do
            echo "tagging ${alias} -> ${SHA_TAG}"
            docker buildx imagetools create --tag "${alias}" "${SHA_TAG}"
          done
