name: Deploy auditor

on:
  push:
    branches: [main]
    paths:
      - "services/auditor/**"
      - "packages/**"
      - ".github/workflows/deploy-auditor.yml"
      # A lockfile or root-manifest change (dependency security fixes,
      # pnpm.overrides) changes the built image without touching this
      # service's own files — it must redeploy too. Witnessed 2026-09-13:
      # the advisory triage merge redeployed only the relay.
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

# No workflow-level concurrency: every push gets its own gate (they wait
# independently), and promotions serialize on the deploy job's
# `production-deploy-auditor` group below (a running deploy is never
# cancelled by a newer push).

# Least privilege: the repo's default GITHUB_TOKEN is write, so every
# workflow states its own. This one only checks out the repo; the deploy
# authenticates with its own secret, never the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # The pre-approval gate (docs/ops/RUNBOOK.md §3 "Molecule production
  # deploys"): CI success on this exact sha, the sha still main's head, and
  # staging success on the sha (a missing staging run FAILS).
  # workflow_dispatch runs through it too; there is no bypass.
  gate:
    uses: ./.github/workflows/molecule-prod-gate.yml
    permissions:
      contents: read
      actions: read # the CI and staging runs on this sha
    with:
      service: auditor
      staging_leg: true

  deploy:
    needs: gate
    # Superseded or failed gate: no deploy, and no approval is requested.
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Promotion: a required reviewer approves this job (Settings → Environments).
    environment: production
    # One promotion of this service at a time; a running deploy is never
    # cancelled. `queue: max` is a LIVENESS control, not a safety control: it
    # keeps a newer pending promotion from being evicted (e.g. by a partial
    # re-run of an older run). Safety comes from the head-of-main re-check.
    # actionlint <= 1.7.12 falsely flags the key (rhysd/actionlint#657);
    # GitHub supports it (changelog 2026-05-07). If GitHub ever rejected it,
    # this workflow would fail to load and nothing would deploy (fail-closed,
    # visible on the first run).
    concurrency:
      group: production-deploy-auditor
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # the post-approval re-check reads the CI and staging runs
    timeout-minutes: 15
    steps:
      # The EXACT sha the gate checked and the reviewer approved — never a branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      # Approval is granted before a job's steps run, so the world may have
      # moved while it waited. Re-run every check on the pinned sha, without
      # waiting: superseded → no deploy (not red); anything else not green →
      # fail. Every step below runs only when this says deploy.
      - name: Re-check the gate after approval
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_MODE: recheck
          GATE_SHA: ${{ needs.gate.outputs.sha }}
          GATE_REPO: ${{ github.repository }}
          GATE_SERVICE: auditor
          GATE_STAGING_LEG: "true"
        run: node scripts/molecule-prod-gate.ts

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
        if: steps.recheck.outputs.deploy == 'true'

      # The service self-bootstraps its identity from the persistent /data
      # volume on first boot — no out-of-band ceremony. Required one-time
      # setup before the first deploy (scripts/deploy-archetype-slate.ts
      # automates this for the staging slate):
      #   fly apps create motebit-auditor
      #   fly volumes create auditor_data --size 1 --region sjc
      #   fly secrets set MOTEBIT_RELAY_URL=... \
      #                   MOTEBIT_SYNC_URL=... MOTEBIT_API_TOKEN=... \
      #                   MOTEBIT_PUBLIC_URL=...
      # (No LLM key — the Auditor is deliberately LLM-free; pure verification.)
      # The prod app deliberately does not exist until the archetype slate
      # promotes (5 consecutive green scheduled conformance runs —
      # scripts/check-promotion-ready.ts). Skipping cleanly keeps this
      # workflow green-but-honest pre-promotion instead of failing red on
      # every main push that touches packages/** (red-noise trains people
      # to ignore red).
      - name: Check prod app exists
        id: appcheck
        if: steps.recheck.outputs.deploy == 'true'
        run: |
          if flyctl status -a motebit-auditor > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::motebit-auditor not provisioned yet — promotion is conformance-gated (check-promotion-ready). Skipping deploy."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to Fly.io
        if: steps.recheck.outputs.deploy == 'true' && steps.appcheck.outputs.exists == 'true'
        # A HANG must fail, not vanish: a job killed by the ceiling
        # reports as `cancelled`, which no `if: failure()` alert
        # matches. See deploy-sync.yml for the incident that showed it.
        timeout-minutes: 15
        run: |
          set -o pipefail
          flyctl deploy --config services/auditor/fly.toml --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
