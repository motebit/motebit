[package]
name = "motebit-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# The platform backends MUST be named: with no feature, keyring 3 compiles to
# its in-memory MOCK store on every OS (Finding B-0 — nothing persisted and
# `~/.motebit/dev-keyring.json` silently became the only key store). Each
# backend's deps are target-gated inside the crate, so one line serves all:
# macOS Keychain, Windows Credential Manager, and on Linux the Secret Service
# over pure-Rust zbus (`async-io` runtime, `crypto-rust`) — no system
# packages at build time; a session without a Secret Service at run time
# falls back to the 0600 file (see src/key_store.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
xcap = "0.9"
enigo = "0.6"
image = "0.25"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux only: the SAME secret-service crate keyring's backend uses (4.x,
# features unified with keyring's), named here so src/key_store.rs can tell
# "no Secret Service provider" (file-only mode) from a failed read on an
# available one (refuse) by downcasting — law K2, never by message text.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", default-features = false }
# The zbus major secret-service 4 is built on (4.x; tauri's own zbus 5 is a
# separate major), for the typed "no owner of org.freedesktop.secrets" match.
zbus = { version = "4", default-features = false }

# macOS Vision framework — native, offline, state-of-the-art OCR used by
# `do_screenshot` to extract text + bounding boxes so the TS sensitivity
# classifier can fail-close on screen captures containing secrets / cards /
# medical data. Vision is only available on macOS; other platforms skip the
# OCR step and return an empty token list (honest degradation — the
# classifier then emits a "raw" redaction, matching web / mobile behaviour
# until those surfaces get their own OCR path).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = { version = "0.3", features = [
  "VNRequest",
  "VNRequestHandler",
  "VNRecognizeTextRequest",
  "VNObservation",
  "VNGeometry",
] }
objc2-core-graphics = "0.3"
# Apple Security framework — Secure Enclave key generation + signing
# for hardware-attestation claims. Only the macOS path uses this; the
# non-macOS `secure_enclave` stub returns `not_supported` without the
# crate pulled in.
security-framework = "3.7"
core-foundation = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
